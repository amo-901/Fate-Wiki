<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fate/Domination Masters</title>
    <link rel="stylesheet" href="masters.css">
    <link rel="icon" type="image/png" href="favicon32x32.png">
</head>
<body>
    <header>
        <div class="upper-taskbar">
            <a href="index.html">
                <img id="taskbar-logo" src="resources/taskbarlogo.png">
            </a>
            <div class="taskbar-buttons">
                <h1 class="nav-button">
                    <a href="servants.html">Servants</a>
                </h1>
                <h1 class="nav-button">
                    <a href="masters.html">Masters</a>
                </h1>
                <h1 class="nav-button">
                    <a href="cardsearch.html">Card Search</a>
                </h1>
                <h1 class="nav-button">
                    <a href="map.html">Map</a>
                </h1>
            </div>         
        </div>
    </header>
    <main>
        <div class="filter-board">
            <input type="text" id="sidebarSearch" class="sidebar-search" placeholder="Search master name...">
            <button id="filterToggle" class="filter-toggle-btn">Filter</button>
        </div>
        <div class="cards-grid" id="cardsGrid"></div>
    </main>
    <footer>
        
    </footer>
    <div class="modal-overlay" id="modalOverlay">
        <div class="master-modal">
            <button class="modal-close" id="modalClose">&times;</button>
            <div class="modal-info">
                <img class="modal-portrait" id="modalPortrait" src="" alt="">
                    <div class="modal-text">
                        <div class="modal-master-title">
                            <h1 class="master-name" id="master-name">Master Name</h1>
                        </div>
                        <p class="modal-master-description" id="master-description"></p>
                    </div>
            </div>
            <div class="modal-section">
                <div class="modal-headings">
                    <p id="ability-heading">Master Abilities: </p>
                </div>
                <div class="ability-grid" id="modalAbilities"></div>
            </div>
            <div class="modal-section">
                <div class="modal-headings">
                    <p id="assets-heading">Master Assets: </p>
                </div>
                <div class="asset-grid" id="modalAssets"></div>
            </div>
        </div>
    </div>

    <script src="masters.js"></script>
</body>
</html>
