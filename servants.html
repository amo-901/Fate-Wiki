<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fate/Domination Servants</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>

    </header>
    <main>
        <div class="filter-bar">
            <label for="classFilter">Filter by class:</label>
            <select id="classFilter">
                <option value="all">All Classes</option>
            </select>
        </div>
        <div class="cards-grid" id="cardsGrid"></div>
    </main>
    <footer>

    </footer>
    <div class="modal-overlay" id="modalOverlay">
        <div class="servant-modal">
            <button class="modal-close" id="modalClose">&times;</button>
            <div class="modal-info">
                <img class="modal-portrait" id="modalPortrait" src="" alt="">
                    <div class="modal-text">
                        <div class="modal-servant-title">
                            <h1>Servant Name</h1>
                        </div>
                        <p class="modal-servant-description"> This is some test text. Lorem ipsum dolor sit amet consectetur adipisicing elit. Nam perspiciatis beatae autem, aliquam cum adipisci vitae quia, nihil magni rerum ut! Optio a fugit quidem aut porro magnam ipsam aliquid?
                        </p>
                    </div>
            </div>
            <div class="modal-headings">
                <p>Servant Skills: </p>
            </div>
            <div class="modal-skills" id="modalSkills"></div>
            <div class="modal-headings">
                <p>Servant Deck: </p>
            </div>
            <div class="deck-grid" id="modalDeck"></div>
            <div class="modal-headings">
                <p id="assets-heading">Servant Assets: </p>
            </div>
            <div class="asset-grid" id="modalAssets"></div>
        </div>
    </div>
    <script src="servants.js"></script>
</body>
</html>
