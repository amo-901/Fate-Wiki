<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fate/Domination Servants</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/png" href="favicon32x32.png">
</head>
<body>
    <header>

    </header>
    <main>
        <div class="filter-board">
            <h1></h1>
        </div>
        <div class="cards-grid" id="cardsGrid"></div>
    </main>
    <footer>

    </footer>
    <div class="modal-overlay" id="modalOverlay">
        <div class="servant-modal">
            <button class="modal-close" id="modalClose">&times;</button>
            <div class="modal-info">
                <img class="modal-portrait" id="modalPortrait" src="" alt="">
                    <div class="modal-text">
                        <div class="modal-servant-title">
                            <h1 class="servant-name" id="servant-name">Servant Name</h1>
                        </div>
                        <p class="modal-servant-description" id="servant-description"> This is some test text. Lorem ipsum dolor sit amet consectetur adipisicing elit. Nam perspiciatis beatae autem, aliquam 
                        </p>
                    </div>
            </div>
            <div class="modal-section">
                <div class="modal-headings">
                    <p>Servant Skills: </p>
                </div>
                <div class="modal-skills" id="modalSkills"></div>
            </div>
            <div class="modal-section">
                <div class="modal-headings">
                    <p>Servant Deck: </p>
                </div>
                <div class="deck-grid" id="modalDeck"></div>
            </div>
            <div class="modal-section">
                <div class="modal-headings">
                <p id="assets-heading">Servant Assets: </p>
                </div>
                <div class="asset-grid" id="modalAssets"></div>
            </div>
        </div>
    </div>
    <script src="servants.js"></script>
</body>
</html>
