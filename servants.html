<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fate/Domination Servants</title>
    <link rel="stylesheet" href="servants.css">
    <link rel="icon" type="image/png" href="favicon32x32.png">
</head>
<body>
    <header>
        <div class="upper-taskbar">
            <a href="index.html">
                <img id="taskbar-logo" src="resources/taskbarlogo.png">
            </a>
            <div class="taskbar-buttons">
                <h1 class="nav-button">
                    <a href="servants.html">Servants</a>
                </h1>
                <h1 class="nav-button">
                    <a href="masters.html">Masters</a>
                </h1>
                <h1 class="nav-button">
                    <a href="cardsearch.html">Card Search</a>
                </h1>
                <h1 class="nav-button">
                    <a href="map.html">Map</a>
                </h1>
            </div>         
        </div>
    </header>
    <main>
        <div class="filter-board">
            <input type="text" id="sidebarSearch" class="sidebar-search" placeholder="Search servant name...">
            <button id="filterToggle" class="filter-toggle-btn">Filter</button>
        </div>
        <div class="cards-grid" id="cardsGrid"></div>
    </main>
    <footer>

    </footer>

    <!-- Filter sidebar -->
    <div class="filter-sidebar" id="filterSidebar">
        <button class="sidebar-close" id="sidebarClose">&times;</button>
        <div class="filter-content">         
            <div class="filter-group">
                <h3>Class</h3>
                <div id="classFilterGroup"></div>
            </div>

            <div class="filter-group">
                <h3>Pros</h3>
                <div id="prosFilterGroup"></div>
            </div>

            <div class="filter-group">
                <h3>Cons</h3>
                <div id="consFilterGroup"></div>
            </div>
        </div>

        <button id="resetFilters" class="reset-btn">Reset</button>
    </div>

    <!-- Servant detail modal -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="servant-modal">
            <button class="modal-close" id="modalClose">&times;</button>
            <div class="modal-info">
                <img class="modal-portrait" id="modalPortrait" src="" alt="">
                    <div class="modal-text">
                        <div class="modal-servant-title">
                            <h1 class="servant-name" id="servant-name">Servant Name</h1>
                            <img id="servant-class-icon">
                        </div>
                        <p class="modal-servant-description" id="servant-description"></p>
                    </div>
            </div>
            <div class="modal-section">
                <div class="modal-headings">
                    <p>Servant Skills: </p>
                </div>
                <div class="modal-skills" id="modalSkills"></div>
            </div>
            <div class="modal-section">
                <div class="modal-headings">
                    <p>Servant Deck: </p>
                </div>
                <div class="deck-grid" id="modalDeck"></div>
            </div>
            <div class="modal-section">
                <div class="modal-headings">
                <p id="assets-heading">Servant Assets: </p>
                </div>
                <div class="asset-grid" id="modalAssets"></div>
            </div>
        </div>
    </div>

    <script src="servants.js"></script>
</body>
</html>
